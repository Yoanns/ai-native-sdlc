# Publishes the agent-agnostic mirror, agent-native-sdlc, on every push to main.
#
# One-time setup — see mirror/README.md:
#   1. Create the empty repository yoanns/agent-native-sdlc on GitHub.
#   2. Generate a key pair:  ssh-keygen -t ed25519 -N "" -f mirror_key
#   3. In agent-native-sdlc → Settings → Deploy keys, add mirror_key.pub
#      with "Allow write access".
#   4. In this repository → Settings → Secrets → Actions, add the private key
#      mirror_key as MIRROR_DEPLOY_KEY.
# Until the secret exists, this workflow tests and builds but skips publishing.
name: mirror

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: mirror
  cancel-in-progress: false

permissions:
  contents: read

env:
  MIRROR_REPO: yoanns/agent-native-sdlc

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Test before publishing anything
        run: python3 scripts/test_mirror.py

      - name: Prepare access to the mirror
        id: access
        env:
          KEY: ${{ secrets.MIRROR_DEPLOY_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::warning::MIRROR_DEPLOY_KEY is not set, so the mirror was built but not published. See mirror/README.md."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p ~/.ssh

          # A key pasted from Notepad or PowerShell ends its lines in \r\n,
          # which OpenSSH rejects. Strip them.
          printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/mirror_key
          chmod 600 ~/.ssh/mirror_key

          # 1. Is it a usable private key, with no passphrase?
          if ! ssh-keygen -y -P "" -f ~/.ssh/mirror_key > /dev/null 2> /tmp/key-error; then
            echo "::error::MIRROR_DEPLOY_KEY is not a usable private key ($(tr '\n' ' ' < /tmp/key-error)). Paste the whole of mirror_key — not mirror_key.pub — from the BEGIN line to the END line, and generate it with -N \"\" so it has no passphrase."
            exit 1
          fi
          echo "Key fingerprint: $(ssh-keygen -lf ~/.ssh/mirror_key)"
          echo "Compare it with the fingerprint shown in ${MIRROR_REPO} → Settings → Deploy keys."

          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2> /dev/null
          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "::error::Could not fetch GitHub's SSH host key."
            exit 1
          fi

          # 2. Which repository does GitHub think this key belongs to?
          #    A deploy key answers "Hi <owner>/<repo>! You've successfully authenticated".
          greeting=$(ssh -i ~/.ssh/mirror_key -o IdentitiesOnly=yes -T git@github.com 2>&1 || true)
          echo "GitHub says: ${greeting}"
          shopt -s nocasematch
          case "$greeting" in
            *"Hi ${MIRROR_REPO}!"*)
              ;;
            *"successfully authenticated"*)
              echo "::error::This key is registered on a different repository or account, not ${MIRROR_REPO}. Add mirror_key.pub as a deploy key on ${MIRROR_REPO} itself."
              exit 1 ;;
            *"Permission denied"*)
              echo "::error::GitHub does not recognize this key. Add mirror_key.pub under ${MIRROR_REPO} → Settings → Deploy keys, and check MIRROR_DEPLOY_KEY holds the matching private key."
              exit 1 ;;
            *)
              echo "::error::Unexpected answer from GitHub over SSH: ${greeting}"
              exit 1 ;;
          esac
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Clone the mirror
        if: steps.access.outputs.publish == 'true'
        env:
          GIT_SSH_COMMAND: ssh -i ~/.ssh/mirror_key -o IdentitiesOnly=yes
        run: git clone "git@github.com:${MIRROR_REPO}.git" mirror-repo

      - name: Build into it
        run: |
          mkdir -p mirror-repo
          python3 scripts/build_mirror.py --out mirror-repo --source-commit "${GITHUB_SHA::7}"

      - name: Publish if anything changed
        if: steps.access.outputs.publish == 'true'
        env:
          GIT_SSH_COMMAND: ssh -i ~/.ssh/mirror_key -o IdentitiesOnly=yes
        working-directory: mirror-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "The mirror is already up to date."
            exit 0
          fi
          git commit -m "Sync from ${GITHUB_REPOSITORY}@${GITHUB_SHA::7}" \
                     -m "Generated by scripts/build_mirror.py. Do not edit this repository directly."
          if ! git push origin HEAD:main; then
            echo "::error::Push refused. If the message above says the key is read only, tick 'Allow write access' on the deploy key in ${MIRROR_REPO} → Settings → Deploy keys."
            exit 1
          fi
          version=$(python3 -c 'import json; print(json.load(open(".mirror-source.json"))["version"])')
          if ! git ls-remote --exit-code --tags origin "refs/tags/v${version}" > /dev/null; then
            git tag -a "v${version}" -m "agent-native-sdlc v${version}"
            git push origin "v${version}"
          fi
          echo "Published: https://github.com/${MIRROR_REPO} (v${version}, from ${GITHUB_SHA::7})"
